name: EShop API Newman Tests CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Run Newman API Tests
        run: |
          newman run postman/collections/SUT_API_Testing.postman_collection.json \
            -e postman/environments/EShop_Local.postman_environment.json \
            -d postman/data/test_data.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export postman/newman/report.html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: newman-html-report
          path: postman/newman/report.html
