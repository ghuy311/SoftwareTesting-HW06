name: EShop API Newman Tests CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Start Backend Server
        run: |
          cd backend
          npm start &
          sleep 5

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Run Newman API Tests - Login (FR-02)
        run: |
          newman run postman/collections/SUT_API_Testing.postman_collection.json \
            -e postman/environments/EShop_Local.postman_environment.json \
            -d postman/data/test_data_login.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export postman/newman/report_login.html \
            --folder "POST /api/login"
        continue-on-error: true

      - name: Run Newman API Tests - Checkout (FR-08)
        run: |
          newman run postman/collections/SUT_API_Testing.postman_collection.json \
            -e postman/environments/EShop_Local.postman_environment.json \
            -d postman/data/test_data_checkout.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export postman/newman/report_checkout.html \
            --folder "POST /api/checkout"
        continue-on-error: true

      - name: Run Newman API Tests - Order Status (FR-18)
        run: |
          newman run postman/collections/SUT_API_Testing.postman_collection.json \
            -e postman/environments/EShop_Local.postman_environment.json \
            -d postman/data/test_data_order_status.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export postman/newman/report_order_status.html \
            --folder "PUT /api/admin/orders/:id/status"
        continue-on-error: true

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-reports
          path: postman/newman/report_*.html
